<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App nav v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#FAFAF7;color:#0E1A2B}
a{color:#0B6E4F;text-decoration:none}a:hover{color:#08553D}
</style>
</helmet>
<header style="width: 1280px; height: 64px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 24px; background: #FFFFFF; border-bottom: 1px solid #E3E6EA; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #0E1A2B">
<a href="MacroV2.dc.html" style="display: flex; align-items: center; gap: 8px; color: #0E1A2B; flex-shrink: 0">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #0E1A2B; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 12L6 7L9 10L13 4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="13" cy="4" r="1.6" fill="#D4A017"></circle></svg></span>
<span style="font-size: 16px; font-weight: 700; letter-spacing: -0.02em">Scora</span>
</a>
<nav aria-label="App" style="display: flex; gap: 18px; height: 64px; align-items: stretch; font-size: 13px; font-weight: 500; flex-shrink: 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="10">
<sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><a href="{{t.href}}" aria-current="page" style="display: flex; align-items: center; color: #0E1A2B; font-weight: 700; border-bottom: 2px solid #0B6E4F; white-space: nowrap">{{t.label}}</a></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{true}}"><a href="{{t.href}}" style="display: flex; align-items: center; color: #5B6778; border-bottom: 2px solid transparent; white-space: nowrap">{{t.label}}</a></sc-if>
</sc-for>
</nav>
<label style="margin-left: auto; display: flex; align-items: center; gap: 8px; width: 200px; min-height: 36px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E3E6EA; border-radius: 999px; background: #FAFAF7">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
<input type="text" placeholder="Search ticker…" style="border: none; background: transparent; outline: none; font-family: inherit; font-size: 13px; color: #0E1A2B; width: 100%">
</label>
<span title="AI analyses left today" style="font-size: 12px; font-weight: 600; color: #3D4A5C; border: 1px solid #E3E6EA; padding: 6px 10px; border-radius: 999px; white-space: nowrap">AI —/—</span>
<button type="button" aria-label="Account" style="width: 36px; height: 36px; border-radius: 999px; border: none; background: #E7F3EE; color: #0B6E4F; font-family: inherit; font-size: 13px; font-weight: 700; flex-shrink: 0">JB</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Daily","Macro","Discovery","Momentum","Stocks","Watchlist","Journal","Track record","Evidence","Audit","None"],"default":"Macro"},"$preview":{"width":1280,"height":64}}'>
class Component extends DCLogic {
renderVals() {
var a = this.props.active ?? 'Macro';
var T = [['Daily','DailyV2.dc.html'],['Macro','MacroV2.dc.html'],['Discovery','DiscoveryV2.dc.html'],['Momentum','MomentumV2.dc.html'],['Stocks','StocksV2.dc.html'],['Watchlist','WatchlistV2.dc.html'],['Journal','JournalV2.dc.html'],['Track record','TrackRecordV2.dc.html'],['Evidence','EvidenceV2.dc.html'],['Audit','AuditV2.dc.html']];
return { tabs: T.map(function (x) { return { label: x[0], href: x[1], on: x[0] === a, off: x[0] !== a }; }) };
}
}
</script>
</body>
</html>
