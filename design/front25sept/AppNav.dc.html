<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App nav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#070E1A;color:#F0F4F8}
a{color:#F59E0B;text-decoration:none}a:hover{color:#FBBF24}
</style>
</helmet>
<header style="width: 1280px; height: 56px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 20px; background: #0B1422; border-bottom: 1px solid #1E3A5F; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #F0F4F8">
<div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<div style="width: 28px; height: 28px; border-radius: 8px; background: #F59E0B; box-shadow: 0 0 20px rgba(245,158,11,0.2); display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 12L6 7L9 10L13 4" stroke="#070E1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="13" cy="4" r="1.5" fill="#070E1A"></circle></svg>
</div>
<span style="font-size: 14px; font-weight: 700; letter-spacing: -0.02em">Scora<span style="font-weight: 400; color: #4A6080; margin-left: 4px">Research</span></span>
</div>
<nav aria-label="Main" style="display: flex; gap: 2px; flex-shrink: 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="10">
<sc-if value="{{t.on}}" hint-placeholder-val="{{false}}">
<a href="#" style="padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #F59E0B; background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.4); white-space: nowrap">{{t.label}}</a>
</sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{true}}">
<a href="#" style="padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #94A3B8; border: 1px solid transparent; white-space: nowrap">{{t.label}}</a>
</sc-if>
</sc-for>
</nav>
<label style="flex-grow: 1; max-width: 200px; display: flex">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search ticker</span>
<input type="text" placeholder="Search ticker or company…" style="width: 100%; background: #122540; border: 1px solid #1E3A5F; border-radius: 10px; color: #F0F4F8; font-family: inherit; font-size: 12px; padding: 6px 12px">
</label>
<div style="display: flex; align-items: center; gap: 10px; margin-left: auto; flex-shrink: 0">
<span style="display: inline-flex; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid #1E3A5F; font-size: 10px; color: #94A3B8"><span style="font-weight: 700">AI</span><span style="font-variant-numeric: tabular-nums">—/—</span></span>
<button type="button" style="font-family: inherit; font-size: 10px; padding: 6px 12px; border-radius: 10px; background: transparent; color: #94A3B8; border: 1px solid #1E3A5F">Sign out</button>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Daily","Macro","Discovery","Momentum","Stocks","Watchlist","Journal","Track Record","Evidence","Audit","None"],"default":"Macro"},"$preview":{"width":1280,"height":56}}'>
class Component extends DCLogic {
renderVals() {
var active = this.props.active ?? 'Macro';
var names = ['Daily','Macro','Discovery','Momentum','Stocks','Watchlist','Journal','Track Record','Evidence','Audit'];
return { tabs: names.map(function (n) { return { label: n, on: n === active, off: n !== active }; }) };
}
}
</script>
</body>
</html>
