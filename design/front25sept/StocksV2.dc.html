<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scora — Stocks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#FAFAF7;color:#0E1A2B}
a{color:#0B6E4F;text-decoration:none}a:hover{color:#08553D}
</style>
</helmet>
<div style="width: 1280px; height: 1200px; box-sizing: border-box; background: #FAFAF7; color: #0E1A2B; font-family: 'Hanken Grotesk', system-ui, sans-serif; line-height: 1.5; display: flex; flex-direction: column">
<dc-import name="AppNavV2" active="Stocks" hint-size="1280px,64px"></dc-import>
<section style="background: #FFFFFF; border-bottom: 1px solid #E3E6EA; padding: 72px 80px 56px; display: flex; flex-direction: column; align-items: center; text-align: center">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 48px; letter-spacing: -0.02em">Analyze any stock</h1>
<p style="margin: 8px 0 28px; font-size: 16px; color: #3D4A5C">Micro fundamentals + macro regime · NYSE, NASDAQ, BME/IBEX, LSE, Xetra, Euronext and more</p>
<form style="display: flex; gap: 8px; width: 680px; background: #FFFFFF; border: 1px solid #C9CFD6; border-radius: 999px; padding: 6px 6px 6px 20px; box-shadow: 0 8px 24px rgba(14,26,43,0.06)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="align-self: center; flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label style="flex-grow: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Company or ticker</span><input type="text" placeholder="Company name or ticker (e.g. Apple, AAPL, SAN.MC)" style="width: 100%; border: none; outline: none; font-family: inherit; font-size: 16px; color: #0E1A2B; background: transparent"></label>
<button type="submit" style="font-family: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0B6E4F; border: none; border-radius: 999px; padding: 0 24px; min-height: 44px">Analyze</button>
</form>
<div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px">
<sc-for list="{{picks}}" as="p" hint-placeholder-count="10">
<a href="StockDetailV2.dc.html" style="font-size: 13px; font-weight: 600; color: #3D4A5C; background: #FAFAF7; border: 1px solid #E3E6EA; padding: 6px 12px; border-radius: 999px">{{p}}</a>
</sc-for>
</div>
</section>
<main style="padding: 48px 80px 64px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">Your watchlist</h2><a href="WatchlistV2.dc.html" style="font-size: 14px; font-weight: 600">Manage →</a></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<a href="StockDetailV2.dc.html" style="position: relative; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 16px; padding: 20px; color: #0E1A2B">
<div style="display: flex; justify-content: space-between"><span style="font-size: 16px; font-weight: 700">[TICKER]</span><span style="font-size: 12px; color: #5B6778">[Exchange]</span></div>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 36px; line-height: 1">—</span><span style="font-size: 12px; color: #5B6778">IC score</span></div>
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; color: #0B6E4F; background: #E7F3EE; padding: 3px 10px; border-radius: 999px">[Rating]</span>
</a>
</sc-for>
</div>
<div style="font-size: 13px; color: #5B6778">Empty state: “Your watchlist is empty. Search any ticker above and analyze it to add it here.”</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1200}}'>
class Component extends DCLogic {
renderVals() { return { picks: ['AAPL','MSFT','NVDA','AMZN','MC.PA','SAP.DE','SAN.MC','NESN.SW','BP.L','ASML.AS'], cards: [1,2,3,4] }; }
}
</script>
</body>
</html>
