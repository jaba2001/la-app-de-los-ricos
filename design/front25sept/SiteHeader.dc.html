<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#FAFAF7;color:#0E1A2B}
a{color:#0B6E4F;text-decoration:none}a:hover{color:#08553D}
</style>
</helmet>
<header style="width: 1280px; height: 72px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; gap: 40px; border-bottom: 1px solid #E3E6EA; background: #FFFFFF; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #0E1A2B">
<a href="LandingV2.dc.html" style="display: flex; align-items: center; gap: 10px; color: #0E1A2B">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #0E1A2B; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 12L6 7L9 10L13 4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="13" cy="4" r="1.6" fill="#D4A017"></circle></svg>
</span>
<span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em">Scora</span>
</a>
<nav aria-label="Main" style="display: flex; gap: 28px; font-size: 14px; font-weight: 500; height: 72px; align-items: stretch">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<sc-if value="{{l.on}}" hint-placeholder-val="{{false}}"><a href="{{l.href}}" aria-current="page" style="display: flex; align-items: center; color: #0E1A2B; font-weight: 600; border-bottom: 2px solid #0B6E4F">{{l.label}}</a></sc-if>
<sc-if value="{{l.off}}" hint-placeholder-val="{{true}}"><a href="{{l.href}}" style="display: flex; align-items: center; color: #3D4A5C; border-bottom: 2px solid transparent">{{l.label}}</a></sc-if>
</sc-for>
</nav>
<div style="margin-left: auto; display: flex; align-items: center; gap: 20px">
<a href="LoginV2.dc.html" style="font-size: 14px; font-weight: 600; color: #0E1A2B">Sign in</a>
<a href="LoginV2.dc.html" style="font-size: 14px; font-weight: 600; color: #FFFFFF; background: #0E1A2B; padding: 11px 20px; border-radius: 999px">Start free</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["How it works","Track record","Evidence","Pricing","None"],"default":"None"},"$preview":{"width":1280,"height":72}}'>
class Component extends DCLogic {
renderVals() {
var a = this.props.active ?? 'None';
var L = [['How it works','HowItWorks.dc.html'],['Track record','TrackRecordV2.dc.html'],['Evidence','EvidenceV2.dc.html'],['Pricing','PricingV2.dc.html']];
return { links: L.map(function (x) { return { label: x[0], href: x[1], on: x[0] === a, off: x[0] !== a }; }) };
}
}
</script>
</body>
</html>
