name: Scora — monthly analyst-revision tracking

# Free "measure-before-you-pay" harness. We proved the deep point-in-time estimate archive is
# the paid product (Finnhub free gives only ~4 months of recommendation history), so revision
# alpha cannot be BACKTESTED for free. This accumulates it FORWARD: each month it snapshots
# every name's analyst consensus level + revision momentum + price into sl_revisions, and once
# ≥2 monthly snapshots exist it computes the live cross-sectional IC of the revision signal vs
# next-month returns. After ~6-12 months the evidence says — on our own universe — whether a
# paid PIT estimate feed (~$100s/mo) is justified. All free (Finnhub recommendation trends).
#
# Requires FINNHUB_KEY plus the Cloud SQL secrets shared by every data workflow
# (GCP_WIF_PROVIDER, GCP_JOBS_SA, PGUSER, PGPASSWORD — see infra/github-actions-cloudsql.sh).
on:
  schedule:
    - cron: "0 15 3 * *" # 3rd of each month, 15:00 UTC (after the monthly score cron on the 2nd)
  workflow_dispatch: {} # allow manual runs

# Los comandos de abajo asumen apps/scora-research: este fichero vivia alli hasta que se
# descubrio que GitHub Actions SOLO mira .github/ en la RAIZ del repositorio. Estuvo sin
# ejecutarse desde que los dos repos se fusionaron en el monorepo.
defaults:
  run:
    working-directory: apps/scora-research

jobs:
  track:
    runs-on: ubuntu-latest
    # id-token: para cambiar el token de OIDC de GitHub por uno de GCP (acción cloud-sql).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias (pg, para escribir en Cloud SQL)
        run: npm ci
      - uses: ./.github/actions/cloud-sql
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_JOBS_SA }}
      - name: Snapshot analyst revisions → sl_revisions (+ live IC)
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: scora
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: node --experimental-strip-types --no-warnings research/cron-revisions.mjs
