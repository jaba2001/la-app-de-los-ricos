name: Scora — monthly universe scoring

# Forms one immutable cohort per month: scores the universe as of the run date
# (point-in-time by construction) and appends to sl_cohort. This is the live,
# systematic forward record — the analog of the historical backtest.
on:
  schedule:
    - cron: "0 14 2 * *" # 2nd of each month, 14:00 UTC (after month-start filings settle)
  workflow_dispatch: {} # allow manual runs

# Los comandos de abajo asumen apps/scora-research: este fichero vivia alli hasta que se
# descubrio que GitHub Actions SOLO mira .github/ en la RAIZ del repositorio. Estuvo sin
# ejecutarse desde que los dos repos se fusionaron en el monorepo.
defaults:
  run:
    working-directory: apps/scora-research

jobs:
  score:
    runs-on: ubuntu-latest
    # id-token: para cambiar el token de OIDC de GitHub por uno de GCP (acción cloud-sql).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias (pg, para escribir en Cloud SQL)
        run: npm ci
      - uses: ./.github/actions/cloud-sql
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_JOBS_SA }}
      - name: Score universe → sl_cohort
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }} # optional — enables delisted coverage
          FRED_KEY: ${{ secrets.FRED_KEY }}
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: scora
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: node --experimental-strip-types --no-warnings research/cron-score.mjs
