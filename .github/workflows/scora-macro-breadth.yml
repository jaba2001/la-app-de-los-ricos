name: Scora — daily macro breadth

# The micro→macro arrow (A2/A3): aggregates the S&P 500 into breadth (% above 200/50-day,
# % with positive momentum) and writes it to macro_state, then compares it to the top-down
# risk-on gauge to set regime_confirmation (confirmed / divergent). Free (Yahoo prices).
#
# DAILY (F3.1) because the divergence is the system's early warning — a weekly read could
# sit on a narrowing tape for days. Weekdays at 10:30 UTC: the latest US close is already
# settled on Yahoo, and it lands BEFORE the ic-proxy macro-refresh (11:00) and push-alerts
# (11:30) crons, so the alert always compares today's breadth against the fresh gauge.
on:
  schedule:
    - cron: "30 10 * * 1-5" # weekdays 10:30 UTC (prior US close settled; before push-alerts)
  workflow_dispatch: {}

# Los comandos de abajo asumen apps/scora-research: este fichero vivia alli hasta que se
# descubrio que GitHub Actions SOLO mira .github/ en la RAIZ del repositorio. Estuvo sin
# ejecutarse desde que los dos repos se fusionaron en el monorepo.
defaults:
  run:
    working-directory: apps/scora-research

jobs:
  breadth:
    runs-on: ubuntu-latest
    # id-token: para cambiar el token de OIDC de GitHub por uno de GCP (acción cloud-sql).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias (pg, para escribir en Cloud SQL)
        run: npm ci
      - uses: ./.github/actions/cloud-sql
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_JOBS_SA }}
      - name: Aggregate breadth → macro_state
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: scora
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: node --experimental-strip-types --no-warnings research/macro_breadth.mjs
