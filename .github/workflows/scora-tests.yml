name: Scora — tests (golden + red-team + build)

# Continuous verification of the guarantees that must never silently regress:
#  1. the pure calculation core (golden.test.mjs) — the math behind every score,
#  2. the AI grounding gate (redteam_grounding.mjs) — "the AI can't hallucinate figures",
#  3. the Scora Picks rules engine and the accounting-integrity layer,
#  4. type safety, the CSS system, and that the app actually builds.
#
# ⚠️ TODOS los pasos van DESPUÉS de `npm ci`, y esto se corrigió el 2026-08-24.
#
# El golden test y el red-team estaban antes, con el comentario «no necesitan dependencias».
# Dejó de ser cierto en algún momento: `lib/horizon.ts` ganó un store compartido con
# `useSyncExternalStore`, y el golden lo importa por sus exports NO-React. El import de
# `react` se ejecuta igual, así que el paso moría con ERR_MODULE_NOT_FOUND en 11 segundos.
#
# **El CI llevaba al menos doce ejecuciones seguidas en rojo por esto**, o sea que las
# garantías que este fichero dice proteger no se estaban comprobando. Un CI en rojo permanente
# es un CI que nadie lee — y entonces da igual lo que verifique.
on:
  push:
    branches: [main]
  pull_request:
  # Semanal aunque nadie toque el código. Lo aprendido el 2026-08-24: las fuentes cambian
  # solas. El CSV de miembros del índice dejó de actualizarse aguas arriba y nadie se enteró
  # en 366 días; la SEC empezó a mezclar cifras de un `DEF 14A` con las del 10-K. Un CI que
  # sólo corre en los commits no ve nada de eso, porque el commit que lo rompe no existe.
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Golden tests (calculation core)
        run: node --experimental-strip-types --no-warnings scripts/golden.test.mjs
      - name: Red-team the grounding gate
        run: node --experimental-strip-types --no-warnings research/redteam_grounding.mjs

      - name: P2 maths self-tests
        run: node --experimental-strip-types --no-warnings scripts/p2.test.mjs
      # Los módulos teóricos (PLAN_TEORIA_FINANCIERA_SCORA.md): CAPM/APT, Ledoit-Wolf,
      # Black-Litterman, límites al arbitraje, costes de agencia y la medición con BSM.
      # Incluye dos invariantes que no pueden romperse en silencio: la descomposición de
      # varianza del modelo factorial debe sumar R², y Black-Litterman con confianza 0 debe
      # devolver EXACTAMENTE los pesos de mercado (es la honestidad hecha aritmética).
      - name: Theory module tests
        run: node --experimental-strip-types --no-warnings scripts/theory.test.mjs
      # Guards the filing-grounding path: chunking that loses no text, and a prompt budget
      # that caps the whole block instead of re-truncating each passage (the original bug).
      - name: Retrieval tests
        run: node --experimental-strip-types --no-warnings scripts/retrieval.test.mjs
      # Las reglas de Scora Picks (§3-§5 de SCORA_PICKS_REGLAS.md) más la partida doble como
      # test de datos, el cálculo del TTM y la señal forense. Un cambio de regla sin abrir una
      # `rules_version` nueva tiene que gritar aquí: el track record de dos versiones no se
      # mezcla jamás.
      - name: Scora Picks — motor de reglas y capa contable
        run: node --experimental-strip-types --no-warnings scripts/picks.test.mjs
      - name: Percentiles sector-relativos
        run: node --experimental-strip-types --no-warnings scripts/percentile.test.mjs
      - name: Roadmap (F3+F4+F5)
        run: node --experimental-strip-types --no-warnings scripts/roadmap.test.mjs
      # ── LA CAPA DE DATOS ──────────────────────────────────────────────────────────────
      # Los cinco defectos encontrados el 2026-08-23/24 vivieron MESES sin que nada fallara:
      # el TTM que no eran doce meses, magnitudes congeladas en 2009, la deuda ausente escrita
      # como cero, los REIT puntuando con una rebanada de sus ingresos y un `DEF 14A` metiendo
      # el resultado de FedEx en millones. Ninguno rompía — todos devolvían un número creíble.
      #
      # Dos partes. La primera pone SUELOS sobre los artefactos versionados: cobertura por
      # métrica, tasas de las cuatro identidades contables y CERO desfases de más de tres años.
      # Si un commit degrada la extracción, salta aquí antes de que nadie publique encima.
      # La segunda es un humo contra la SEC de verdad con seis nombres, uno por defecto; si la
      # SEC no responde, avisa y se salta en vez de romper el build.
      - name: Guardián de la capa de datos
        run: node --experimental-strip-types --no-warnings scripts/datos.test.mjs

      # Un parámetro que entra en una función y no se usa nunca es la firma de un defecto que
      # no rompe: la función acepta una pregunta y responde otra. El 2026-09-01 se encontró
      # que `universoEW(eje, excluir)` ignoraba `excluir`, así que la referencia «universo
      # equiponderado SIN financieros» era el MISMO cálculo que la de con ellos — cuatro
      # números idénticos al decimal con 56 nombres supuestamente fuera. Durante meses eso
      # contestó que los financieros no aportaban nada a la referencia, que es justo la
      # pregunta de §11 y la que decide si merece la pena meter bancos en el universo.
      - name: Parámetros que entran y no se usan
        run: node --experimental-strip-types --no-warnings research/parametros_muertos.mjs

      # ¿Siguen valiendo los números publicados? Un artefacto de backtest que ya no sale de las
      # entradas que hay ahora es peor que no tenerlo: se sigue citando. El 2026-08-29 una
      # corrida abortó por memoria DESPUÉS del trabajo caro, no escribió, y los números
      # publicados siguieron siendo los del día anterior sin que nada lo dijera.
      - name: Frescura de los artefactos publicados
        run: node --experimental-strip-types --no-warnings research/frescura_artefactos.mjs

      - name: Typecheck
        run: npx tsc --noEmit
      - name: CSS regression guard
        run: node scripts/css-lint.mjs

      # The 10-K section parser is pure heuristics over documents we don't control, so its
      # failures are silent: you get a thesis grounded in the wrong paragraph, not an error.
      # This runs the current parser and a frozen copy of the pre-2026-08-10 one over the
      # same real filings and fails if the change lost ground.
      #
      # Six tickers, not all 28, because each one is an SEC download: NVDA (the over-broad
      # NAV filter), AMAT (colon separator), DELL (em-dash separator), AMD (why a plain
      # hyphen must NOT be a separator), CSCO (citation-aware terminator) and STX
      # (earliest-wins selection). Between them they exercise every fix. If SEC is
      # unreachable the harness skips those tickers and says so rather than failing the
      # build. Run the full 28 locally before changing the parser.
      - name: 10-K parser regression (subset)
        run: node --experimental-strip-types --no-warnings research/parser_regression.mjs NVDA AMAT DELL AMD CSCO STX

      # No secrets: lib/supabase.ts falls back to placeholder credentials and every
      # integration (PostHog, Sentry, push, Resend) no-ops when its env var is absent.
      # A build that needs secrets to compile would be the actual bug.
      - name: Build
        run: npx next build
