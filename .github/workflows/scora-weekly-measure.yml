name: Scora — weekly track-record measurement

# Marks every immutable cohort to today's price, computes realized alpha vs SPY,
# and refreshes sl_track_summary so the Track Record page updates weekly even
# though new cohorts only form monthly.
on:
  schedule:
    - cron: "0 14 * * 1" # every Monday, 14:00 UTC
  workflow_dispatch: {}

# Los comandos de abajo asumen apps/scora-research: este fichero vivia alli hasta que se
# descubrio que GitHub Actions SOLO mira .github/ en la RAIZ del repositorio. Estuvo sin
# ejecutarse desde que los dos repos se fusionaron en el monorepo.
defaults:
  run:
    working-directory: apps/scora-research

jobs:
  measure:
    runs-on: ubuntu-latest
    # id-token: para cambiar el token de OIDC de GitHub por uno de GCP (acción cloud-sql).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias (pg, para escribir en Cloud SQL)
        run: npm ci
      - uses: ./.github/actions/cloud-sql
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_JOBS_SA }}
      - name: Measure cohorts → sl_track_summary
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }} # optional — enables delisted coverage
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: scora
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: node --experimental-strip-types --no-warnings research/cron-measure.mjs
